name: crawl-tiktok-qrevo

# Runs on GitHub's servers — your Mac does NOT need to be on.
on:
  schedule:
    # 17:15 Asia/Saigon (UTC+7) == 10:15 UTC, every day.
    # Off the top-of-hour (:00) on purpose — GitHub heavily delays/drops :00 schedules.
    - cron: '15 10 * * *'
    # Weekly backup run: if the daily schedule is delayed/dropped, Monday's
    # second run still closes the completed week and publishes its winners.
    - cron: '45 11 * * 1'
    # --- Near-realtime option: uncomment to also run every 30 minutes ---
    # (GitHub schedules can be delayed several minutes under load.)
    # - cron: '*/30 * * * *'
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

# Needed only if OUTPUTS includes "excel" (commits the xlsx/csv back).
permissions:
  contents: write

concurrency:
  group: crawl-tiktok
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google service-account credentials (from secret)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: printf '%s' "$GOOGLE_CREDENTIALS" > google-credentials.json

      - name: Write TikTok cookies (optional secret, helps avoid IP blocks)
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          if [ -n "$TIKTOK_COOKIES" ]; then
            printf '%s' "$TIKTOK_COOKIES" > cookies.txt
            echo "cookies.txt written"
          else
            echo "no TIKTOK_COOKIES secret — running without cookies"
          fi

      - name: Run crawler
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          # Keep the daily job comfortably within its timeout. New videos are
          # still collected in full; only the optional metric re-fetch window
          # is shortened so it cannot delay weekly winner publication.
          REFRESH_DAYS: "7"
        run: python crawl.py

      - name: Commit results back (only if Excel output is enabled)
        run: |
          rm -f google-credentials.json cookies.txt   # never commit secrets
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit data + the auto-rebuilt public report (GitHub Pages source).
          git add output/ index.html bao-cao-qrevo2pro-tiktok.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No local file changes to commit (Google Sheets output is live)."
          else
            git commit -m "update qrevo videos + report ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            # Never silently ignore a rejected push: retry a safe rebase so
            # the generated report is not left only on the runner.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            echo "Could not publish generated files after 3 attempts."
            exit 1
          fi
